name: 核验归档产物
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 核验产物与冻结依赖
        run: python3 scripts/verify_artifacts.py
      - name: 核验发布文件清单
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS
